general {
  hide_cursor = true
}

background {
	path = /home/leter/Pictures/catppuccin-wallpapers/black-hole-cold.png
	blur_passes = 2
	blur_size = 2
	# color = rgb(282828)
}

input-field {
	size = 180, 30
	outline_thickness = 1
	rounding = 4
	outer_color = rgb(183, 189, 248)
	inner_color = rgb(24, 25, 38)
	font_color = rgb(202, 211, 245)
	check_color = rgb(238, 212, 159)
	fail_color = rgb(237, 135, 150)
	fade_on_empty = true
	# placeholder_text =
	fail_text = failed
}

label {
    text = cmd[update:1000]date +"%T"
    color = rgb(202, 211, 245)
    font_size = 45

    position = 0, 425
    halign = center
    valign = center
}

label {
    text = cmd[update:1000]date +"%d-%m-%Y (%A)"
    color = rgb(202, 211, 245)
    font_size = 20

    position = 0, 370
    halign = center
    valign = center
}

label {
    text = cmd[update:1000]date +"Week %W - Day %j"
    color = rgb(202, 211, 245)
    font_size = 20

    position = 0, 330
    halign = center
    valign = center
}

label {
    text = cmd[update:60] uptime -p
    color = rgb(184, 192, 224)
    font_size = 14
    position = 0, -450
    halign = center
    valign = center
}

label {
    text = cmd[update:1000]cat /sys/class/power_supply/BAT0/capacity | tr -d '\n'; echo -n '% (' ; cat /sys/class/power_supply/BAT0/status | tr -d '\n'; echo ')'
    color = rgb(184, 192, 224)
    font_size = 14
    position = 0, -475
    halign = center
    valign = center
}

label {
    text = $LAYOUT
    color = rgb(184, 192, 224)
    font_size = 14
    position = 0, -500
    halign = center
    valign = center
}
